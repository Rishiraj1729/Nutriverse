<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout | Nutriverse</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500;1,9..144,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="announce">India shipping · ₹49 · free over ₹499</div>
  <header class="site-header">
    <div class="wrap header-inner">
      <a href="/" class="logo" aria-label="Nutriverse home"><img src="assets/logo.png" alt="Nutriverse"></a>
      <nav class="nav-desktop" aria-label="Primary">
        <a href="/">Home</a>
        <a href="products.html">Products</a>
        <a href="about.html">About</a>
        <a href="maknova.html">Maknova</a>
      </nav>
      <a class="header-cta" href="products.html">Keep shopping</a>
      <button type="button" class="cart-btn" data-open-cart aria-label="Open cart">Cart <span class="cart-count">0</span></button>
      <button class="menu-toggle" aria-label="Open menu" aria-expanded="false"><span></span><span></span></button>
    </div>
    <nav class="nav-mobile">
      <a href="/">Home</a>
      <a href="products.html">Products</a>
      <a href="checkout.html">Checkout</a>
    </nav>
  </header>

  <main class="wrap">
    <section class="page-hero">
      <p class="section-kicker">Checkout</p>
      <h1>WHERE SHOULD<br>THE CRUNCH GO?</h1>
    </section>

    <div class="checkout-grid">
      <form class="checkout-form" id="checkout-form">
        <h2>Delivery</h2>
        <p class="subcopy" id="account-hint" style="margin-bottom:16px">Checking account…</p>
        <div class="field"><label for="name">Full name</label><input id="name" name="name" required autocomplete="name"></div>
        <div class="field"><label for="phone">Mobile</label><input id="phone" name="phone" required inputmode="numeric" maxlength="10" autocomplete="tel"></div>
        <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email"></div>
        <div class="field"><label for="address">Address</label><textarea id="address" name="address" rows="3" required></textarea></div>
        <div class="field"><label for="pincode">Pincode</label><input id="pincode" name="pincode" required inputmode="numeric" maxlength="6"></div>
        <div class="field"><label for="city">City</label><input id="city" name="city" required></div>
        <div class="field">
          <label for="state">State</label>
          <select id="state" name="state" required>
            <option value="">Select</option>
            <option>Andhra Pradesh</option><option>Arunachal Pradesh</option><option>Assam</option>
            <option>Bihar</option><option>Chhattisgarh</option><option>Delhi</option>
            <option>Goa</option><option>Gujarat</option><option>Haryana</option>
            <option>Himachal Pradesh</option><option>Jammu and Kashmir</option><option>Jharkhand</option>
            <option>Karnataka</option><option>Kerala</option><option>Madhya Pradesh</option>
            <option>Maharashtra</option><option>Manipur</option><option>Meghalaya</option>
            <option>Mizoram</option><option>Nagaland</option><option>Odisha</option>
            <option>Punjab</option><option>Rajasthan</option><option>Sikkim</option>
            <option>Tamil Nadu</option><option>Telangana</option><option>Tripura</option>
            <option>Uttar Pradesh</option><option>Uttarakhand</option><option>West Bengal</option>
          </select>
        </div>

        <h2 style="margin-top:20px">Pay</h2>
        <div class="pay-options">
          <label class="pay-option">
            <input type="radio" name="pay" value="cod" checked>
            <span><strong>Cash on Delivery</strong><br>Pay when the packet arrives. Works now.</span>
          </label>
          <label class="pay-option" id="upi-option">
            <input type="radio" name="pay" value="online">
            <span><strong>UPI / cards</strong><br><small id="upi-note">Checking Razorpay…</small></span>
          </label>
        </div>
        <p class="form-error" id="form-error"></p>
        <button type="submit" class="btn btn-dark" id="place-order">Place order</button>
      </form>

      <aside class="order-box" id="summary-box">
        <h2>Order</h2>
        <p class="subcopy">Your cart is empty.</p>
        <a class="btn btn-outline" href="products.html">Shop</a>
      </aside>
    </div>
  </main>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/checkout.js"></script>
  <script src="script.js"></script>
</body>
</html>
