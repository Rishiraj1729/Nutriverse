<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout | Nutriverse</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500;1,9..144,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="announce">India shipping · ₹49 · free over ₹499</div>
  <header class="site-header">
    <div class="wrap header-inner">
      <a href="/" class="logo" aria-label="Nutriverse home"><img src="assets/logo.png" alt="Nutriverse"></a>
      <nav class="nav-desktop" aria-label="Primary">
        <a href="/">Home</a>
        <a href="products.html">Products</a>
        <a href="about.html">About</a>
        <a href="maknova.html">Maknova</a>
      </nav>
      <a class="header-cta" href="products.html">Keep shopping</a>
      <button type="button" class="cart-btn" data-open-cart aria-label="Open cart">Cart <span class="cart-count">0</span></button>
      <button class="menu-toggle" aria-label="Open menu" aria-expanded="false"><span></span><span></span></button>
    </div>
    <nav class="nav-mobile">
      <a href="/">Home</a>
      <a href="products.html">Products</a>
      <a href="checkout.html">Checkout</a>
    </nav>
  </header>

  <main class="wrap">
    <section class="page-hero">
      <p class="section-kicker">Checkout</p>
      <h1>WHERE SHOULD<br>THE CRUNCH GO?</h1>
    </section>

    <div class="checkout-grid">
      <form class="checkout-form" id="checkout-form">
        <h2>Delivery</h2>
        <div class="field"><label for="name">Full name</label><input id="name" name="name" required autocomplete="name"></div>
        <div class="field">
          <label for="phone">Mobile (10 digits)</label>
          <input id="phone" name="phone" required inputmode="numeric" pattern="[6-9][0-9]{9}" maxlength="10" minlength="10" autocomplete="tel" placeholder="98XXXXXX10">
        </div>
        <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email"></div>
        <div class="field">
          <label for="state">State</label>
          <select id="state" name="state" required>
            <option value="">Select state</option>
          </select>
        </div>
        <div class="field">
          <label for="district">District</label>
          <select id="district" name="district" required disabled>
            <option value="">Select state first</option>
          </select>
        </div>
        <div class="field"><label for="line1">Address line 1</label><input id="line1" name="line1" required autocomplete="address-line1" placeholder="Building, house no., street"></div>
        <div class="field"><label for="line2">Address line 2</label><input id="line2" name="line2" autocomplete="address-line2" placeholder="Area, landmark (optional)"></div>
        <div class="field"><label for="line3">Address line 3</label><input id="line3" name="line3" placeholder="Optional"></div>
        <div class="field">
          <label for="pincode">Pincode</label>
          <input id="pincode" name="pincode" required inputmode="numeric" pattern="[0-9]{6}" maxlength="6" minlength="6" placeholder="400001">
        </div>

        <h2 style="margin-top:20px">Coupon</h2>
        <p class="subcopy" style="margin-bottom:10px">Optional. Example: <strong>RD100</strong> takes ₹100 off the cart.</p>
        <div class="coupon-row">
          <input id="form-coupon" name="coupon" type="text" maxlength="20" placeholder="Enter coupon code" autocomplete="off">
          <button type="button" class="btn btn-outline" id="form-apply-coupon">Apply</button>
        </div>
        <p class="subcopy" id="coupon-status" style="margin-top:8px"></p>

        <h2 style="margin-top:20px">Pay</h2>
        <div class="pay-options">
          <div class="pay-option" id="upi-option">
            <span><strong>UPI / cards / netbanking</strong><br><small id="upi-note">Checking Razorpay…</small></span>
          </div>
        </div>
        <p class="form-error" id="form-error"></p>
        <button type="submit" class="btn btn-dark" id="place-order" disabled>Pay now</button>
      </form>

      <aside class="order-box" id="summary-box">
        <h2>Order</h2>
        <p class="subcopy">Your cart is empty.</p>
        <a class="btn btn-outline" href="products.html">Shop</a>
      </aside>
    </div>
  </main>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/india-places.js"></script>
  <script src="js/checkout.js"></script>
  <script src="script.js"></script>
</body>
</html>
