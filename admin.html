<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin | Nutriverse</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500;1,9..144,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="announce">Admin · SKUs &amp; orders</div>
  <header class="site-header">
    <div class="wrap header-inner">
      <a href="/" class="logo"><img src="assets/logo.png" alt="Nutriverse"></a>
      <nav class="nav-desktop">
        <a href="account.html">Account</a>
        <a href="admin.html" class="active">Admin</a>
      </nav>
      <a class="header-cta" href="products.html">Store</a>
      <button class="menu-toggle" aria-label="Open menu" aria-expanded="false"><span></span><span></span></button>
    </div>
    <nav class="nav-mobile">
      <a href="account.html">Account</a>
      <a href="admin.html">Admin</a>
    </nav>
  </header>

  <main class="wrap">
    <section class="page-hero">
      <p class="section-kicker">Dashboard</p>
      <h1>STORE DESK.</h1>
      <p class="subcopy" style="margin-top:12px">Log in with userid <strong>Admin_Nutriverse</strong> to manage SKUs and orders.</p>
    </section>

    <div class="admin-tabs" role="tablist">
      <button type="button" class="admin-tab active" data-tab="skus">SKUs &amp; prices</button>
      <button type="button" class="admin-tab" data-tab="orders">Orders</button>
    </div>
    <p class="form-error" id="admin-error"></p>
    <p class="admin-ok" id="admin-ok"></p>

    <section id="tab-skus" class="admin-panel">
      <form class="sku-form" id="shipping-form">
        <h2>Shipping</h2>
        <div class="sku-form-grid">
          <div class="field">
            <label for="ship-flat">Flat shipping (₹)</label>
            <input id="ship-flat" name="shipping_flat" type="number" min="0" step="1" required>
          </div>
          <div class="field">
            <label for="ship-free">Free above (₹)</label>
            <input id="ship-free" name="free_above" type="number" min="0" step="1" required>
          </div>
          <div class="field sku-form-action">
            <button type="submit" class="btn btn-dark">Save shipping</button>
          </div>
        </div>
      </form>

      <form class="sku-form" id="sku-form">
        <h2>Add a SKU</h2>
        <div class="sku-form-grid">
          <div class="field">
            <label for="sku-name">Name</label>
            <input id="sku-name" name="name" required placeholder="Peri Punch 50g">
          </div>
          <div class="field">
            <label for="sku-id">SKU id</label>
            <input id="sku-id" name="id" placeholder="auto from name">
          </div>
          <div class="field">
            <label for="sku-price">Price (₹)</label>
            <input id="sku-price" name="price" type="number" min="1" step="1" required>
          </div>
          <div class="field">
            <label for="sku-category">Category</label>
            <select id="sku-category" name="category">
              <option value="makhana">Flavoured makhana</option>
              <option value="cookies">Cookies</option>
              <option value="raw">Raw &amp; bulk</option>
              <option value="maknova">Maknova</option>
            </select>
          </div>
          <div class="field">
            <label for="sku-unit">Unit</label>
            <input id="sku-unit" name="unit" placeholder="pack" value="pack">
          </div>
          <div class="field">
            <label for="sku-image">Image</label>
            <input id="sku-image" name="image" placeholder="assets/product.png or https://…">
          </div>
          <div class="field sku-form-wide">
            <label for="sku-blurb">Blurb</label>
            <input id="sku-blurb" name="blurb" placeholder="Short line on the product card">
          </div>
        </div>
        <button type="submit" class="btn btn-dark" style="margin-top:12px">Add to store</button>
      </form>

      <div class="table-wrap">
        <table class="admin-table" id="sku-table">
          <thead>
            <tr>
              <th>SKU</th>
              <th>Category</th>
              <th>Price ₹</th>
              <th>On store</th>
              <th></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section id="tab-orders" class="admin-panel" hidden>
      <div class="table-wrap">
        <table class="admin-table" id="admin-table">
          <thead>
            <tr>
              <th>Order</th>
              <th>When</th>
              <th>Customer</th>
              <th>Pay</th>
              <th>Total</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="js/products.js"></script>
  <script src="js/auth.js"></script>
  <script src="script.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
